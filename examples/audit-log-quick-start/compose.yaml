services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: audit_test
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d audit_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    # Data is disposable and removed when the container is removed.
    tmpfs:
      - /var/lib/postgresql/data
