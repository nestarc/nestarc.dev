name: Generate API Reference

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1' # Every Monday at 3:17 AM UTC

concurrency:
  group: generate-api-reference
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate package catalog
        run: npm run catalog:validate

      - name: Check for catalog release drift
        run: npm run catalog:releases

      - name: Generate API docs
        run: npm run api:generate

      - name: Validate generated docs and site
        run: npm run docs:check

      - name: Verify generated changes
        run: |
          git status --short -- api/
          unexpected_paths="$(git status --porcelain=v1 --untracked-files=all | awk '{print $2}' | grep -v '^api/' || true)"
          if [ -n "$unexpected_paths" ]; then
            echo "Generation changed files outside api/:" >&2
            echo "$unexpected_paths" >&2
            exit 1
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --all api/
          if git diff --cached --quiet; then
            echo "No changes to API docs"
            exit 0
          else
            git commit -m "docs: auto-generate API reference from source"
          fi

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "Generated API docs conflict with the latest main branch" >&2
              exit 1
            fi

            # A queued or concurrent main update can change the catalog,
            # generator, dependencies, or validation contract. Reinstall and
            # validate the rebased tree before publishing it.
            npm ci
            npm run docs:check

            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main advanced during push attempt $attempt; retrying" >&2
          done

          echo "main kept advancing; leaving API docs unpublished" >&2
          exit 1
