name: Generate API Reference

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1' # Every Monday at 3:17 AM UTC

concurrency:
  group: generate-api-reference
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate API docs
        run: npm run api:generate

      - name: Validate API docs
        run: npm run api:validate

      - name: Build VitePress
        run: npm run docs:build

      - name: Verify generated changes
        run: |
          git status --short -- api/
          unexpected_paths="$(git status --porcelain=v1 --untracked-files=all | awk '{print $2}' | grep -v '^api/' || true)"
          if [ -n "$unexpected_paths" ]; then
            echo "Generation changed files outside api/:" >&2
            echo "$unexpected_paths" >&2
            exit 1
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --all api/
          if git diff --cached --quiet; then
            echo "No changes to API docs"
          else
            git commit -m "docs: auto-generate API reference from source"
            git push
          fi
