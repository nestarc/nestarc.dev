name: Verify customer API keys example

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'examples/api-keys-quick-start/**'
      - 'scripts/api-keys-example/**'
      - 'public/examples/api-keys-0.4.0.zip'
      - 'blog/nestjs-customer-api-keys.md'
      - '.github/workflows/api-keys-example.yml'
  push:
    branches: [main]
    paths:
      - 'examples/api-keys-quick-start/**'
      - 'scripts/api-keys-example/**'
      - 'public/examples/api-keys-0.4.0.zip'
      - 'blog/nestjs-customer-api-keys.md'
      - '.github/workflows/api-keys-example.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bash scripts/api-keys-example/verify.sh
